<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="880" height="430">
  <!-- Rounded square icon with ECG waveform - WHITE VERSION -->
  <g transform="translate(50, 80)">
    <!-- Rounded square background -->
    <rect x="0" y="0" width="270" height="270" rx="45" ry="45" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="20"/>
    
    <!-- ECG/Heartbeat waveform inside the square -->
    <path d="M 40,135 L 80,135 L 100,80 L 115,190 L 130,110 L 145,135 L 230,135" 
          stroke="#FFFFFF" 
          stroke-width="18" 
          fill="none" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>
  
  <!-- ClinicEMR text - WHITE -->
  <text x="360" y="230" font-family="Arial, Helvetica, sans-serif" font-size="110" font-weight="700" fill="#FFFFFF">
    ClinicEMR
  </text>
  
  <!-- Medical Records System subtitle - WHITE -->
  <text x="380" y="300" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="400" fill="#FFFFFF" opacity="0.95">
    Medical Records System
  </text>
</svg>
