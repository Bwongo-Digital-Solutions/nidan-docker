# OpenMRS Backend Docker Build & Push
# Triggers on changes in openmrs/ EXCEPT openmrs/frontend/
# (custom_modules, distro, Dockerfile, etc.)

name: OpenMRS Backend Build & Push

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - dev-clinicemr
      - main
    paths:
      - 'openmrs/**'
      - 'dev.uganda.docker-compose.yml'
      - '!openmrs/frontend/**'
  pull_request:
    branches:
      - dev
      - dev-clinicemr
      - main
    paths:
      - 'openmrs/**'
      - '!openmrs/frontend/**'

concurrency:
  group: openmrs-backend-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: docker.io
  IMAGE_BASE: trigonaltechnology

jobs:
  build-and-deploy:
    name: Build & Push openmrs-backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Uganda development Compose overlay
        run: docker compose -f dev.docker-compose.yml -f dev.uganda.docker-compose.yml config --quiet

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BASE }}/openmrs-backend
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/dev-clinicemr' || github.base_ref == 'dev' || github.base_ref == 'dev-clinicemr' }}
            type=ref,event=pr
            type=raw,value=stable,enable=${{ github.ref == 'refs/heads/main' || github.base_ref == 'main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: openmrs
          file: openmrs/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            CACHE_BUST=${{ github.run_id }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=openmrs-backend
          cache-to: type=gha,mode=max,scope=openmrs-backend
