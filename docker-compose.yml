  # ============================================================================
  # DHIS2 / FEDERAL HMIS INTEGRATION
  # ============================================================================
  nidan-dhis2-db:
    image: mysql:8.0
    container_name: nidan-dhis2-db
    environment:
      MYSQL_DATABASE: ${DHIS2_DB_NAME:-nidan_dhis2}
      MYSQL_USER: ${DHIS2_DB_USER:-nidan}
      MYSQL_PASSWORD: ${DHIS2_DB_PASSWORD:-nidan}
      MYSQL_ROOT_PASSWORD: ${DHIS2_DB_ROOT_PASSWORD:-nidan_root}
    volumes:
      - dhis2-integration-db-data:/var/lib/mysql
    networks:
      - nidan-network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DHIS2_DB_USER:-nidan}", "-p${DHIS2_DB_PASSWORD:-nidan}" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  nidan-dhis2:
    image: trigonaltechnology/nidan-dhis2-integration:latest
    container_name: nidan-dhis2
    ports:
      - "${DHIS2_APP_PORT:-5003}:5000"
    volumes:
      # Runtime / persistent data and YAML config
      - ./dhis2/mappings:/app/mappings
      - ./dhis2/connections:/app/connections
      - ./dhis2/sql:/app/sql
      # Runtime / persistent data
      - dhis2-integration-data:/app/data
      - dhis2-integration-audit-logs:/app/audit_logs
      - dhis2-integration-app-logs:/app/logs
    environment:
      # Flask
      - SECRET_KEY=${DHIS2_SECRET_KEY:-change-me-in-production}
      - DEBUG=${DHIS2_DEBUG:-false}
      - FLASK_ENV=${DHIS2_FLASK_ENV:-production}
      # Internal audit DB (dedicated MySQL)
      - DATABASE_URL=mysql+pymysql://${DHIS2_DB_USER:-nidan}:${DHIS2_DB_PASSWORD:-nidan}@${DHIS2_DB_HOST:-nidan-dhis2-db}:${DHIS2_DB_PORT:-3306}/${DHIS2_DB_NAME:-nidan_dhis2}
      # Auth
      - AUTH_PROVIDER=${DHIS2_AUTH_PROVIDER:-env_file}
      - ADMIN_USERNAME=${DHIS2_ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${DHIS2_ADMIN_PASSWORD:-pass}
      - REPORTER_USERNAME=${DHIS2_REPORTER_USERNAME:-reporter}
      - REPORTER_PASSWORD=${DHIS2_REPORTER_PASSWORD:-change-me}
      # Source DB connections — URLs built entirely from env vars
      - OPENMRS_DB_URL=mysql+pymysql://${OPENMRS_DB_USER}:${OPENMRS_DB_PASSWORD}@${OPENMRS_DB_HOST:-openmrs-db}:${OPENMRS_DB_PORT:-3306}/${OPENMRS_DB_NAME}
      - OPENELIS_DB_URL=postgresql://${OPENELIS_DB_USER:-clinlims}:${OPENELIS_DB_PASSWORD}@${OPENELIS_DB_HOST:-openelis-db}:${OPENELIS_DB_PORT:-5432}/${OPENELIS_DB_NAME:-clinlims}
      - ODOO_DB_URL=postgresql://${ODOO_DB_USER}:${ODOO_DB_PASSWORD}@${ODOO_DB_HOST:-odoo-db}:${ODOO_DB_PORT:-5432}/${ODOO_DB_NAME}
      # Connection settings
      - DB_CONNECT_TIMEOUT=${DHIS2_DB_CONNECT_TIMEOUT:-10}
      - DB_DATE_OVERLAP_BUFFER_DAYS=${DHIS2_DB_DATE_OVERLAP_BUFFER_DAYS:-2}
      # Federal HMIS (Nepal)
      - FEDERAL_HMIS_URL=${FEDERAL_HMIS_URL}
      - FEDERAL_HMIS_USERNAME=${FEDERAL_HMIS_USERNAME}
      - FEDERAL_HMIS_PASSWORD=${FEDERAL_HMIS_PASSWORD}
      - FEDERAL_HMIS_SSL_VERIFY=${FEDERAL_HMIS_SSL_VERIFY:-false}
      - FEDERAL_HMIS_ORG_UNIT=${FEDERAL_HMIS_ORG_UNIT}
      # Provincial DHIS2 (optional — leave blank to disable)
      - PROVINCIAL_DHIS2_URL=${PROVINCIAL_DHIS2_URL:-}
      - PROVINCIAL_DHIS2_USERNAME=${PROVINCIAL_DHIS2_USERNAME:-}
      - PROVINCIAL_DHIS2_PASSWORD=${PROVINCIAL_DHIS2_PASSWORD:-}
      - PROVINCIAL_DHIS2_SSL_VERIFY=${PROVINCIAL_DHIS2_SSL_VERIFY:-true}
      - PROVINCIAL_DHIS2_ORG_UNIT=${PROVINCIAL_DHIS2_ORG_UNIT:-}
    networks:
      - nidan-network
    depends_on:
      nidan-dhis2-db:
        condition: service_healthy
      openmrs-db:
        condition: service_healthy
      odoo-db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python3", "-c", "import socket; s = socket.socket(socket.AF_INET, socket.SOCK_STREAM); s.settimeout(1); s.connect(('127.0.0.1', 5000))" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ============================================================================
  # APACHE SUPERSET
  # ============================================================================
  superset:
    build: ./superset
    image: ${SUPERSET_IMAGE:-trigonaltechnology/superset:latest}
    container_name: nidan-superset
    ports:
      - "8088:8088" # Keep for direct access during debugging, remove in production
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      SUPERSET_LOAD_EXAMPLES: ${SUPERSET_LOAD_EXAMPLES:-no}
      PYTHONPATH: /app/pythonpath

      # CRITICAL: Set the public-facing base URL
      SUPERSET_WEBSERVER_ADDRESS: '0.0.0.0'
      SUPERSET_WEBSERVER_PORT: '8088'

      # Tell Superset it's behind a reverse proxy at /superset/
      SCRIPT_NAME: /superset
      # Fix health check path issue
      SUPERSET_HEALTH_CHECK_ENDPOINT: /health

      # Database connections (seeded at startup for OpenMRS, OpenELIS, Odoo)
      OPENMRS_DB_HOST: ${OPENMRS_DB_HOST:-openmrs-db}
      OPENMRS_DB_PORT: ${OPENMRS_DB_PORT:-3306}
      OPENMRS_DB_NAME: ${OPENMRS_DB_NAME:-openmrs}
      OPENMRS_DB_USER: ${OPENMRS_DB_USER:-openmrs}
      OPENMRS_DB_PASSWORD: ${OPENMRS_DB_PASSWORD:-openmrs}
      OPENELIS_DB_HOST: ${OPENELIS_DB_HOST:-openelis-db}
      OPENELIS_DB_PORT: ${OPENELIS_DB_PORT:-5432}
      OPENELIS_DB_NAME: ${OPENELIS_DB_NAME:-clinlims}
      OPENELIS_DB_USER: ${OPENELIS_DB_USER:-clinlims}
      OPENELIS_DB_PASSWORD: ${OPENELIS_DB_PASSWORD:-clinlims}
      ODOO_DB_HOST: ${ODOO_DB_HOST:-odoo-db}
      ODOO_DB_PORT: ${ODOO_DB_PORT:-5432}
      ODOO_DB_NAME: ${ODOO_DB_NAME:-nidan}
      ODOO_DB_USER: ${ODOO_DB_USER:-nidan}
      ODOO_DB_PASSWORD: ${ODOO_DB_PASSWORD:-nidan}

    command: [ "/bin/sh", "/app/docker-entrypoint.sh" ]
    networks:
      - nidan-network
    depends_on:
      openmrs-db:
        condition: service_healthy
      openelis-db:
        condition: service_healthy
      odoo-db:
        condition: service_healthy
    volumes:
      - superset-home:/app/superset_home
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py:ro
      - ./superset/init_superset_metadata.py:/app/pythonpath/init_superset_metadata.py:ro
      - ./superset/docker-entrypoint.sh:/app/docker-entrypoint.sh:ro
      - ./superset/metadata:/app/superset_metadata:ro
    restart: unless-stopped
