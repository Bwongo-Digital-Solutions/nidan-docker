networks:
  nidan-network:
    driver: bridge

volumes:
  openmrs-data:
  openmrs-db-data: # openmrs-db-postgres-data:  # commented - PostgreSQL for OpenMRS disabled for now

  odoo-data:
  odoo-db-data:
  orthanc-data:
  orthanc-db-data:
  nidan-openelis-data:
  openelis-db-data:
  openelis-lucene-index:
  openelis-properties:
  certbot-etc:
  certbot-www:
  nidan-integration-db-data:
  dhis2-integration-db-data:
  dhis2-integration-data:
  dhis2-integration-audit-logs:
  dhis2-integration-app-logs:
  superset-home:

services:
  # ============================================================================
  # PROXY / GATEWAY
  # ============================================================================
  gateway:
    # build: ./proxy  # local dev: docker compose build gateway
    # CI: dev → trigonaltechnology/gateway:latest | main → :stable
    image: ${GATEWAY_IMAGE:-trigonaltechnology/gateway:latest}
    ports:
      - "80:80"
      - "443:443"
      - "8443:8443"
    environment:
      - GATEWAY_DOMAIN=${GATEWAY_DOMAIN:-localhost}
      - OPENELIS_DOMAIN=${OPENELIS_DOMAIN}
      # OpenELIS context path (must match the backend SERVER_SERVLET_CONTEXT_PATH)
      - OPENELIS_CONTEXT_PATH=${OPENELIS_CONTEXT_PATH:-/api/OpenELIS-Global/}
      # Odoo card URL on the gateway dashboard (index.html)
      - DASHBOARD_ODOO_URL=${DASHBOARD_ODOO_URL:-http://localhost:8069}
    networks:
      - nidan-network
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf.template:ro
      - ./proxy/index.html.template:/etc/nginx/templates/index.html.template:ro
      - ./proxy/nidan-logo.png:/usr/share/nginx/html/nidan-logo.png:ro
      - ./proxy/trigonal-logo.png:/usr/share/nginx/html/trigonal-logo.png:ro
      - ./proxy/502.html:/usr/share/nginx/html/502.html:ro
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped # Auto-restart if it fails during startup

  # # ============================================================================
  # # OPENMRS
  # # ============================================================================
  openmrs-backend:
    build: ./openmrs
    image: trigonaltechnology/openmrs-backend:latest
    # image: openmrs-backend:local
    # user: root
    container_name: nidan-openmrs-backend
    environment:
      # Database (MySQL) - OMRS_DB_HOSTNAME/OMRS_DB_PORT used by wait-for-it.sh; OMRS_DB_URL for connection
      OMRS_DB: mysql
      OMRS_DB_HOSTNAME: openmrs-db
      OMRS_DB_PORT: "3306"
      OMRS_DB_URL: jdbc:mysql://openmrs-db:3306/${OPENMRS_DB_NAME:-openmrs}?useUnicode=true&characterEncoding=UTF-8&sessionVariables=storage_engine=InnoDB
      OMRS_DB_USERNAME: ${OPENMRS_DB_USER:-openmrs}
      OMRS_DB_PASSWORD: ${OPENMRS_DB_PASSWORD:-openmrs}
      OMRS_DB_DRIVER_CLASS: com.mysql.cj.jdbc.Driver
      # Installation (MySQL creates DB via MYSQL_DATABASE; skip OpenMRS create-database step)
      OMRS_CONFIG_MODULE_WEB_ADMIN: "true"
      OMRS_CONFIG_AUTO_UPDATE_DATABASE: "true"
      OMRS_CONFIG_CREATE_TABLES: "true"
      OMRS_CONFIG_HAS_CURRENT_OPENMRS_DATABASE: "true"
      # Debug mode: attach remote debugger on port 5005 (e.g. from IDE) - disable to speed startup
      # OMRS_DEV_DEBUG_PORT: "5005"
      # JVM: more heap for faster Spring context refresh (many modules = slow bean creation)
      OMRS_JAVA_MEMORY_OPTS: "-Xmx2g -Xms1g"
      # JVM (optional overrides)
      _JAVA_OPTIONS: "-Dcsrf.enabled=false"
      # Nidan paywall → Odoo payment-status API (read by nidancore via System.getenv;
      # no openmrs-runtime.properties edit / startup.sh patch needed).
      NIDANCORE_ODOO_URL: ${NIDANCORE_ODOO_URL:-http://odoo:8069}
      NIDANCORE_ODOO_PAYMENT_SECRET: ${NIDAN_ODOO_SECRET}
    # ports:
    #   - "5005:5005"  # Remote debug port
    networks:
      - nidan-network
    depends_on:
      openmrs-db:
        condition: service_healthy
    volumes:
      - openmrs-data:/openmrs/data
      # Optional dev: mount locally-built OMODs (startup.sh copies *.omod into data/modules on start).
      - ./openmrs/custom_modules:/openmrs/custom_modules:ro
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/openmrs/" ]
      interval: 30s
      timeout: 10s
      retries: 15
      start_period: 1200s

  openmrs-frontend:
    # build:
    #   context: ./openmrs/frontend
    #   dockerfile: Dockerfile
    #   args:
    #     NIDAN_CALENDAR_BUNDLE: "1.0.0-v9"   # bump after repacking the tgz
    # Vanilla upstream SPA (no BS calendar): dockerfile: Dockerfile.vanilla
    image: trigonaltechnology/openmrs-frontend:latest
    container_name: nidan-openmrs-frontend
    environment:
      - SPA_PATH=/openmrs/spa
      - API_URL=/openmrs
      - SPA_CONFIG_URLS=/openmrs/spa/config-core_demo.json

    #uncomment to mount nginx to override and allow backend-frontend communication when running without the gateway 
    # volumes:
    #   - ./openmrs/frontend/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - nidan-network
    depends_on:
      openmrs-backend:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/index.html" ]
      interval: 30s
      timeout: 10s
      retries: 3

  openmrs-db:
    image: mariadb:10.11
    container_name: nidan-openmrs-db
    # Debezium/CIS: row-based binlog events for wide rows must fit max_allowed_packet (error 1236 if too small).
    command: mysqld --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --log-bin=mysql-bin --binlog_format=ROW --server-id=1 --binlog_row_image=FULL --max-allowed-packet=512M
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: ${OPENMRS_DB_NAME:-openmrs}
      MYSQL_USER: ${OPENMRS_DB_USER:-openmrs}
      MYSQL_PASSWORD: ${OPENMRS_DB_PASSWORD:-openmrs}
      MYSQL_ROOT_PASSWORD: ${OPENMRS_DB_ROOT_PASSWORD:-openmrs}
    volumes:
      - openmrs-db-data:/var/lib/mysql
    networks:
      - nidan-network

  # PostgreSQL for OpenMRS - commented out for now
  # openmrs-db-postgres:
  #   image: postgres:15-alpine
  #   container_name: nidan-openmrs-db-postgres
  #   profiles:
  #     - openmrs-postgres
  #   command: >
  #     postgres -c wal_level=logical -c max_slot_wal_keep_size=${POSTGRES_MAX_SLOT_WAL_KEEP_SIZE:-1GB}
  #   healthcheck:
  #     test: [ "CMD-SHELL", "pg_isready -U ${OPENMRS_DB_USER:-openmrs} -d ${OPENMRS_DB_NAME:-openmrs}" ]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 5
  #   ports:
  #     - "5433:5432"
  #   environment:
  #     POSTGRES_DB: ${OPENMRS_DB_NAME:-openmrs}
  #     POSTGRES_USER: ${OPENMRS_DB_USER:-openmrs}
  #     POSTGRES_PASSWORD: ${OPENMRS_DB_PASSWORD:-openmrs}
  #   volumes:
  #     - openmrs-db-postgres-data:/var/lib/postgresql/data
  #     - ./openmrs/db/init-openmrs-db.sql:/docker-entrypoint-initdb.d/init-openmrs-db.sql:ro
  #   networks:
  #     - nidan-network

  # ============================================================================
  # ODOO
  # ============================================================================
  odoo:
    # Published image includes the runtime and addons; override ODOO_IMAGE as needed.
    image: ${ODOO_IMAGE:-trigonaltechnology/nidan_odoo_pro:latest}
    container_name: nidan-odoo
    command: [ "odoo", "-d", "${ODOO_DB_NAME:-nidan}", "--proxy-mode", "--dev=xml", "-u", "all" ]
    ports:
      - "8069:8069"
    environment:
      # Odoo reads these environment variables automatically
      - HOST=${ODOO_DB_HOST}
      - USER=${ODOO_DB_USER}
      - PASSWORD=${ODOO_DB_PASSWORD}
      - PORT=${ODOO_DB_PORT}
      - ODOO_DB_NAME=${ODOO_DB_NAME}
      - ODOO_ADMIN_EMAIL=${ODOO_ADMIN_EMAIL:-nidan}
      - ODOO_ADMIN_PASSWORD=${ODOO_ADMIN_PASSWORD:-nidan}
      # PostgreSQL superuser for database creation
      - POSTGRES_USER=${ODOO_POSTGRES_USER}
      - POSTGRES_PASSWORD=${ODOO_POSTGRES_PASSWORD}
      # Nidan OIS connector
      - NIDAN_OIS_URL=${NIDAN_OIS_URL}
      - NIDAN_OIS_SECRET=${NIDAN_OIS_SECRET}
      - NIDAN_ODOO_SECRET=${NIDAN_ODOO_SECRET}
      # New Config Variables
      - ODOO_WEB_BASE_URL=${ODOO_WEB_BASE_URL:-http://localhost:8069}
      - ODOO_WEB_BASE_URL_FREEZE=${ODOO_WEB_BASE_URL_FREEZE:-True}
      - ODOO_DB_FILTER=^${ODOO_DB_NAME:-nidan}$
    volumes:
      - odoo-data:/var/lib/odoo
      # Addons come from the image (baked at /mnt/extra-addons + /mnt/private-addons).
      # - ${ODOO_ADDONS_PATH}:/mnt/extra-addons:ro
      # Live-mount the closed-source addons so the current source (not the baked copy) is used.
      # - ${ODOO_PRIVATE_ADDONS_HOST_PATH}:/mnt/private-addons:ro
      # odoo.conf from git (read-only). Entrypoint copies to container; runtime changes stay in container.
      - ./odoo/odoo.conf:/mnt/odoo.conf.template:ro
    networks:
      - nidan-network
    depends_on:
      odoo-db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8069/web/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  odoo-db:
    image: postgres:15
    container_name: nidan-odoo-db
    environment:
      POSTGRES_DB: ${ODOO_POSTGRES_DB}
      POSTGRES_PASSWORD: ${ODOO_POSTGRES_PASSWORD}
      POSTGRES_USER: ${ODOO_POSTGRES_USER}
      # Pass Odoo DB config to init script
      ODOO_DB_NAME: ${ODOO_DB_NAME}
      ODOO_DB_USER: ${ODOO_DB_USER}
      ODOO_DB_PASSWORD: ${ODOO_DB_PASSWORD}
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
      - ./odoo/db/init-odoo-db.sh:/docker-entrypoint-initdb.d/init-odoo-db.sh:ro
    networks:
      - nidan-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${ODOO_POSTGRES_USER:-odoo} -d ${ODOO_POSTGRES_DB:-postgres}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # ORTHANC
  # ============================================================================
  orthanc:
    image: orthancteam/orthanc:latest
    container_name: nidan-orthanc
    ports:
      - "8042:8042" # HTTP/REST API
      - "4242:4242" # DICOM
    environment:
      # Enable plugins
      DICOM_WEB_PLUGIN_ENABLED: "true"
      WORKLISTS_PLUGIN_ENABLED: "true"
      POSTGRESQL_PLUGIN_ENABLED: "true"
      OHIF_PLUGIN_ENABLED: "true"
      ORTHANC_EXPLORER_2_ENABLED: "true"
      WEBHOOKS_PLUGIN_ENABLED: "true"
      # Set to false in production
      VERBOSE_STARTUP: "true"
      # PostgreSQL database (dynamic/secrets)
      ORTHANC__POSTGRESQL__ENABLE_INDEX: "true"
      # Set to false to store actual DICOM files on the filesystem instead of the database
      ORTHANC__POSTGRESQL__ENABLE_STORAGE: "false"
      ORTHANC__POSTGRESQL__HOST: "${ORTHANC_DB_HOST:-orthanc-db}"
      ORTHANC__POSTGRESQL__PORT: "5432"
      ORTHANC__POSTGRESQL__DATABASE: "${ORTHANC_DB_NAME:-orthanc}"
      ORTHANC__POSTGRESQL__USERNAME: "${ORTHANC_DB_USER:-orthanc}"
      ORTHANC__POSTGRESQL__PASSWORD: "${ORTHANC_DB_PASSWORD:-orthanc}"
      # Authentication (dynamic/secrets)
      ORTHANC__REGISTERED_USERS: |
        {"${ORTHANC_USERNAME:-nidan}": "${ORTHANC_PASSWORD:-nidan}"}
      # Exposed for healthchecks / operators (Orthanc reads ORTHANC__* for config)
      ORTHANC_USERNAME: "${ORTHANC_USERNAME:-nidan}"
      ORTHANC_PASSWORD: "${ORTHANC_PASSWORD:-nidan}"
      # Dynamic Webhook to CIS
      ORTHANC_WEBHOOK_URL: "http://${CIS_HOST:-nidan-cis}:${CIS_PORT:-8081}/orthanc/webhook"
    networks:
      - nidan-network
    depends_on:
      - orthanc-db
    volumes:
      - certbot-etc:/etc/letsencrypt:ro
      # Static configuration file
      - ./orthanc/orthanc.json:/etc/orthanc/orthanc.json:ro
      - ./orthanc/webhook.lua:/etc/orthanc/webhook.lua:ro
      # Worklist directory for MWL plugin
      - ./orthanc/worklists:/var/lib/orthanc/worklists
      # DICOM File Storage (use a named volume or change to a host path like /mnt/dicom:/var/lib/orthanc/db)
      - orthanc-data:/var/lib/orthanc/db
    healthcheck:
      # TCP-only check: "healthy" means port listens, not that the UI loaded (UI needs HTTP Basic auth).
      test: [ "CMD", "python3", "-c", "import socket; s = socket.socket(socket.AF_INET, socket.SOCK_STREAM); s.settimeout(1); s.connect(('127.0.0.1', 8042))" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  orthanc-db:
    image: postgres:15
    container_name: nidan-orthanc-db
    environment:
      POSTGRES_DB: ${ORTHANC_DB_NAME}
      POSTGRES_USER: ${ORTHANC_DB_USER}
      POSTGRES_PASSWORD: ${ORTHANC_DB_PASSWORD}
    volumes:
      - orthanc-db-data:/var/lib/postgresql/data
    networks:
      - nidan-network

  # ============================================================================
  # OPENELIS (Placeholder)
  # ============================================================================
  nidan-certbot:
    image: certbot/certbot:latest
    container_name: nidan-certbot
    entrypoint: "/bin/sh -c 'trap \"exit 0\" TERM; while :; do certbot renew --webroot -w /var/www/certbot --agree-tos --noninteractive --keep-until-expiring; sleep 12h & wait $${!}; done;'"
    environment:
      - CERTBOT_EMAIL=${CERTBOT_EMAIL}
      - CERTBOT_DOMAINS=${CERTBOT_DOMAINS}
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    networks:
      - nidan-network

  openelis-db:
    image: trigonaltechnology/openelis-global-2-database:latest
    container_name: nidan-openelis-db
    platform: linux/amd64
    ports:
      - "15432:5432"
    environment:
      POSTGRES_DB: ${OPENELIS_DB_NAME:-clinlims}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${OPENELIS_DB_PASSWORD:-changeme}
      DB_PASSWORD: ${OPENELIS_DB_PASSWORD:-changeme}
      DB_SUPERUSER_PASSWORD: ${OPENELIS_DB_PASSWORD:-changeme}
    volumes:
      - openelis-db-data:/var/lib/postgresql/data
    networks:
      - nidan-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${OPENELIS_DB_USER:-postgres} -d ${OPENELIS_DB_NAME:-clinlims}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # OpenELIS backend (Tomcat) - FIXED with HTTP enabled
  openelis:
    image: trigonaltechnology/openelis-global-2:latest
    container_name: nidan-openelis
    ports:
      - "8083:8080"
    depends_on:
      openelis-db:
        condition: service_healthy
    environment:
      - DEFAULT_PW=${OPENELIS_DEFAULT_ADMIN_PASSWORD:-adminADMIN!}
      - TZ=${OPENELIS_TZ:-UTC}
      # Database connection
      - CATALINA_OPTS=-Ddatasource.url=jdbc:postgresql://openelis-db:5432/clinlims -Ddatasource.username=clinlims -Ddatasource.password=${OPENELIS_DB_PASSWORD:-changeme}
      # Disable Odoo integration
      - ODOO_ENABLED=false
      - ORG_OPENELISGLOBAL_ODOO_ENABLED=false
      - OPENELIS_ENABLE_HTTPS=false
    networks:
      - nidan-network
    volumes:
      # IMPORTANT: Mount the fixed server.xml that enables HTTP on port 8080
      - ./openelis/tomcat/server.xml:/usr/local/tomcat/conf/server.xml:ro
      - openelis-properties:/var/lib/openelis-global/properties
      - ./openelis/volume/configuration:/var/lib/openelis-global/configuration
      - ./openelis/volume/plugins:/var/lib/openelis-global/plugins
      - ./openelis/volume/ocl:/var/lib/openelis-global/ocl
      - ./openelis/volume/logs/oeLogs:/var/lib/openelis-global/logs
      - ./openelis/volume/logs/tomcatLogs:/usr/local/tomcat/logs
      - ./openelis/volume/analyzer:/var/lib/openelis-global/analyzer
      - ./openelis/volume/odoo:/var/lib/openelis-global/odoo
      - openelis-lucene-index:/var/lib/lucene_index
      - ./openelis/volume/properties/common.properties:/run/secrets/common.properties:ro
      - ./openelis/volume/certs:/etc/openelis-global:ro
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8080/OpenELIS-Global/ || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
    restart: unless-stopped

  # OpenELIS Frontend
  openelis-frontend:
    image: trigonaltechnology/openelis-global-2-frontend:latest
    container_name: nidan-openelis-frontend
    platform: linux/amd64
    ports:
      - "8085:80"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - PUBLIC_URL=/openelis
      - REACT_APP_BASE_PATH=/openelis
      - REACT_APP_SERVER_BASE=/api/OpenELIS-Global # This tells frontend where backend is
    networks:
      - nidan-network

  # ============================================================================
  # NIDAN INTEGRATION MIDDLEWARE (Kafka + Postgres + CIS/OIS)
  # ============================================================================
  nidan-integration-db:
    image: postgres:15
    container_name: nidan-integration-db
    environment:
      POSTGRES_DB: ${INTEGRATION_DB_NAME:-nidan_integration}
      POSTGRES_USER: ${INTEGRATION_DB_USER:-nidan}
      POSTGRES_PASSWORD: ${INTEGRATION_DB_PASSWORD:-nidan}
    volumes:
      - nidan-integration-db-data:/var/lib/postgresql/data
    networks:
      - nidan-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${INTEGRATION_DB_USER:-nidan} -d ${INTEGRATION_DB_NAME:-nidan_integration}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # Zookeeper for Kafka (Confluent images)
  nidan-zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: nidan-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: ${ZOOKEEPER_CLIENT_PORT:-2181}
      ZOOKEEPER_TICK_TIME: ${ZOOKEEPER_TICK_TIME:-2000}
      ZOOKEEPER_HEAP_OPTS: ${ZOOKEEPER_HEAP_OPTS:--Xmx256m -Xms256m}
    networks:
      - nidan-network
    healthcheck:
      test: [ "CMD", "cub", "zk-ready", "localhost:2181", "10" ]
      interval: 10s
      timeout: 15s
      retries: 6
      start_period: 25s
    restart: unless-stopped

  nidan-kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: nidan-kafka
    environment:
      KAFKA_BROKER_ID: ${KAFKA_BROKER_ID:-1}
      KAFKA_ZOOKEEPER_CONNECT: "${KAFKA_ZOOKEEPER_CONNECT:-nidan-zookeeper:2181}"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:${KAFKA_PORT:-9092}"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://nidan-kafka:${KAFKA_PORT:-9092}"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR:-1}
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: ${KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR:-1}
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: ${KAFKA_TRANSACTION_STATE_LOG_MIN_ISR:-1}
      KAFKA_MIN_INSYNC_REPLICAS: ${KAFKA_MIN_INSYNC_REPLICAS:-1}
      # Dev/single-broker: more heap + I/O threads reduce GC stalls and broker timeouts under many consumers.
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS:--Xmx768m -Xms768m}
      KAFKA_JVM_PERFORMANCE_OPTS: ${KAFKA_JVM_PERFORMANCE_OPTS:--XX:+UseG1GC -XX:MaxGCPauseMillis=20 -XX:+ExitOnOutOfMemoryError}
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: ${KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS:-3000}
      KAFKA_NUM_NETWORK_THREADS: ${KAFKA_NUM_NETWORK_THREADS:-8}
      KAFKA_NUM_IO_THREADS: ${KAFKA_NUM_IO_THREADS:-8}
      KAFKA_SOCKET_SEND_BUFFER_BYTES: ${KAFKA_SOCKET_SEND_BUFFER_BYTES:-102400}
      KAFKA_SOCKET_RECEIVE_BUFFER_BYTES: ${KAFKA_SOCKET_RECEIVE_BUFFER_BYTES:-102400}
      KAFKA_SOCKET_REQUEST_MAX_BYTES: ${KAFKA_SOCKET_REQUEST_MAX_BYTES:-104857600}
      KAFKA_REPLICA_SOCKET_TIMEOUT_MS: ${KAFKA_REPLICA_SOCKET_TIMEOUT_MS:-60000}
      KAFKA_CONTROLLER_SOCKET_TIMEOUT_MS: ${KAFKA_CONTROLLER_SOCKET_TIMEOUT_MS:-60000}
    depends_on:
      nidan-zookeeper:
        condition: service_healthy
    networks:
      - nidan-network
    healthcheck:
      test: [ "CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:${KAFKA_PORT:-9092} >/dev/null 2>&1 || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 8
      start_period: 45s
    restart: unless-stopped

  # CIS / OIS: build from ../nidan-middleware/integration (Maven runs in Docker).
  #   docker compose build nidan-cis nidan-ois
  #   docker compose up --build nidan-cis nidan-ois
  # Set NIDAN_CIS_IMAGE / NIDAN_OIS_IMAGE to registry tags to use prebuilt images without local build.
  nidan-cis:
    # build:
    #   context: ../nidan-middleware/integration
    #   dockerfile: Dockerfile.cis
    image: ${NIDAN_CIS_IMAGE:-nidan-cis:local}
    container_name: nidan-cis
    ports:
      - "${CIS_PORT:-8081}:${CIS_PORT:-8081}"
    # Share MWL directory with Orthanc (same host path as orthanc service worklists volume)
    volumes:
      # Must match Orthanc container worklist path (see orthanc service volume)
      - ./orthanc/worklists:/var/lib/orthanc/worklists

    # To call an EXTERNAL HTTPS OpenELIS :
    # 1) Map the ELIS hostname to your ELIS IP
    # extra_hosts:
    #   - "elis.openelis-global.org:192.168.1.74"
    # 2) Mount a truststore built from the ELIS TLS certificate
    # volumes:
    #   - ./openelis-truststore.p12:/etc/ssl/certs/openelis-truststore.p12:ro
    environment:
      # Database
      - INTEGRATION_DB_URL=jdbc:postgresql://${INTEGRATION_DB_HOST:-nidan-integration-db}:${INTEGRATION_DB_PORT:-5432}/${INTEGRATION_DB_NAME:-nidan_integration}
      - INTEGRATION_DB_USER=${INTEGRATION_DB_USER:-nidan}
      - INTEGRATION_DB_PASSWORD=${INTEGRATION_DB_PASSWORD:-nidan}
      # Actuator: omit Redis health when broker absent (see MANAGEMENT_HEALTH_REDIS_ENABLED in .env)
      - MANAGEMENT_HEALTH_REDIS_ENABLED=${MANAGEMENT_HEALTH_REDIS_ENABLED:-false}
      #OpenMRS database (used by Debezium)
      - OPENMRS_DB_HOST=${OPENMRS_DB_HOST:-openmrs-db}
      - OPENMRS_DB_PORT=${OPENMRS_DB_PORT:-3306}
      # Kafka
      - KAFKA_BOOTSTRAP_SERVERS=nidan-kafka:${KAFKA_PORT:-9092}
      - CIS_KAFKA_GROUP_ID=${CIS_KAFKA_GROUP_ID:-nidan-cis}
      # Client timeouts / backoff (Spring application.yml — override via .env if needed)
      - KAFKA_CONSUMER_REQUEST_TIMEOUT_MS=${KAFKA_CONSUMER_REQUEST_TIMEOUT_MS:-120000}
      - KAFKA_CONSUMER_SESSION_TIMEOUT_MS=${KAFKA_CONSUMER_SESSION_TIMEOUT_MS:-45000}
      - KAFKA_CONSUMER_HEARTBEAT_INTERVAL_MS=${KAFKA_CONSUMER_HEARTBEAT_INTERVAL_MS:-15000}
      - KAFKA_CONSUMER_MAX_POLL_INTERVAL_MS=${KAFKA_CONSUMER_MAX_POLL_INTERVAL_MS:-600000}
      - KAFKA_CONSUMER_FETCH_MAX_WAIT_MS=${KAFKA_CONSUMER_FETCH_MAX_WAIT_MS:-500}
      - KAFKA_PRODUCER_REQUEST_TIMEOUT_MS=${KAFKA_PRODUCER_REQUEST_TIMEOUT_MS:-120000}
      - KAFKA_PRODUCER_DELIVERY_TIMEOUT_MS=${KAFKA_PRODUCER_DELIVERY_TIMEOUT_MS:-180000}
      - KAFKA_PRODUCER_LINGER_MS=${KAFKA_PRODUCER_LINGER_MS:-5}
      - KAFKA_METADATA_MAX_AGE_MS=${KAFKA_METADATA_MAX_AGE_MS:-300000}
      - KAFKA_RECONNECT_BACKOFF_MS=${KAFKA_RECONNECT_BACKOFF_MS:-500}
      - KAFKA_RECONNECT_BACKOFF_MAX_MS=${KAFKA_RECONNECT_BACKOFF_MAX_MS:-10000}
      # OpenMRS
      - OPENMRS_ENABLED=${OPENMRS_ENABLED:-true}
      - OPENMRS_BASE_URL=${OPENMRS_BASE_URL:-http://openmrs-backend:8080/openmrs}
      - OPENMRS_USERNAME=${OPENMRS_USERNAME:-admin}
      - OPENMRS_PASSWORD=${OPENMRS_PASSWORD:-Admin123}
      - OPENMRS_IDENTIFIER_TYPE_UUID=${OPENMRS_IDENTIFIER_TYPE_UUID:-05a29f94-c0ed-11e2-94be-8c13b969e334}
      - OPENMRS_DEFAULT_LOCATION_UUID=${OPENMRS_DEFAULT_LOCATION_UUID:-44c3efb0-2583-4c80-a79e-1f756a03c0a1}
      - OPENMRS_FHIR_EXTENSION_URL=${OPENMRS_FHIR_EXTENSION_URL:-http://fhir.openmrs.org/ext/patient/identifier#location}
      # Orthanc
      - ORTHANC_ENABLED=${ORTHANC_ENABLED:-true}
      - ORTHANC_BASE_URL=${ORTHANC_BASE_URL:-http://orthanc:8042}
      - ORTHANC_USERNAME=${ORTHANC_USERNAME:-orthanc}
      - ORTHANC_PASSWORD=${ORTHANC_PASSWORD:-orthanc}
      - ORTHANC_DICOM_UID_ROOT=${ORTHANC_DICOM_UID_ROOT:-1.2.840.10008}
      - ORTHANC_WORKLIST_DIR=${ORTHANC_WORKLIST_DIR:-/var/lib/orthanc/worklists}
      - DICOM_TYPE=${DICOM_TYPE:-orthanc}
      # Order type UUIDs (Initializer ordertypes.csv); CIS resolves to order_type_id at startup
      - OPENMRS_ORDER_TYPE_UUID_DRUG=${OPENMRS_ORDER_TYPE_UUID_DRUG:-131168f4-15f5-102d-96e4-000c29c2a5d7}
      - OPENMRS_ORDER_TYPE_UUID_LAB=${OPENMRS_ORDER_TYPE_UUID_LAB:-52a447d3-a64a-11e3-9aeb-50e549534c5e}
      - OPENMRS_ORDER_TYPE_UUID_RADIOLOGY=${OPENMRS_ORDER_TYPE_UUID_RADIOLOGY:-c19c8e82-8b8d-4b4e-b1ff-3f09890b2db3}
      - OPENMRS_ORDER_TYPE_UUID_PROCEDURE=${OPENMRS_ORDER_TYPE_UUID_PROCEDURE:-4237a01f-29c5-4167-9d8e-96d6e590aa33}
      - OPENMRS_ORDER_TYPE_UUID_MEDICAL_SUPPLY=${OPENMRS_ORDER_TYPE_UUID_MEDICAL_SUPPLY:-dab3ab30-2feb-48ec-b4af-8332a0831b49}
      - OPENMRS_ORDER_TYPE_UUID_BED=${OPENMRS_ORDER_TYPE_UUID_BED:-}
      # OpenELIS
      - OPENELIS_ENABLED=${OPENELIS_ENABLED:-false}
      - OPENELIS_BASE_URL=${OPENELIS_BASE_URL:-http://openelis:8080/OpenELIS-Global/rest}
      #Uncomment the fhir base url and order bundle path for lab order sync to openelis 
      # - OPENELIS_FHIR_BASE_URL=${OPENELIS_FHIR_BASE_URL:-http://openelis-fhir:8080}
      # - OPENELIS_ORDER_BUNDLE_PATH=${OPENELIS_ORDER_BUNDLE_PATH:-/fhir/tasks}
      - OPENELIS_USERNAME=${OPENELIS_USERNAME:-admin}
      - OPENELIS_PASSWORD=${OPENELIS_PASSWORD:-adminADMIN!}
      #- "JAVA_TOOL_OPTIONS=-Djavax.net.ssl.trustStore=/etc/ssl/certs/openelis-truststore.p12 -Djavax.net.ssl.trustStorePassword=openelisTrust123"
      # Integration
      - INTEGRATION_SOURCE_SYSTEM=${INTEGRATION_SOURCE_SYSTEM:-CIS}
      - INTEGRATION_SKIP_SOURCE_SYSTEMS=${INTEGRATION_SKIP_SOURCE_SYSTEMS:-OPENMRS}
      - RADIOLOGY_ACCESSION_PREFIX=${RADIOLOGY_ACCESSION_PREFIX:-RAD-}
      - RADIOLOGY_PROCEDURE_CODE_PREFIX=${RADIOLOGY_PROCEDURE_CODE_PREFIX:-RAD-}
      # Per-flow toggles (integration.flows.* — see nidan-docker/env.template)
      - INTEGRATION_FLOW_RADIOLOGY_MWL_ENABLED=${INTEGRATION_FLOW_RADIOLOGY_MWL_ENABLED:-true}
      - INTEGRATION_FLOW_RADIOLOGY_POS_ENABLED=${INTEGRATION_FLOW_RADIOLOGY_POS_ENABLED:-true}
      - INTEGRATION_FLOW_LAB_OPENELIS_ENABLED=${INTEGRATION_FLOW_LAB_OPENELIS_ENABLED:-true}
      - INTEGRATION_FLOW_LAB_POS_ENABLED=${INTEGRATION_FLOW_LAB_POS_ENABLED:-true}
      - INTEGRATION_FLOW_DEBEZIUM_PUBLISH_ORDERS_LAB_ENABLED=${INTEGRATION_FLOW_DEBEZIUM_PUBLISH_ORDERS_LAB_ENABLED:-true}
      - INTEGRATION_FLOW_DEBEZIUM_PUBLISH_ORDERS_RADIOLOGY_ENABLED=${INTEGRATION_FLOW_DEBEZIUM_PUBLISH_ORDERS_RADIOLOGY_ENABLED:-true}
      # Debezium Embedded (CIS)--var control for debezium
      - DEBEZIUM_ENABLED=${DEBEZIUM_ENABLED:-false}
      - DEBEZIUM_DB_USER=${DEBEZIUM_DB_USER:-root}
      - DEBEZIUM_DB_PASSWORD=${DEBEZIUM_DB_PASSWORD:-root}
      - DEBEZIUM_TABLE_INCLUDE_LIST=${DEBEZIUM_TABLE_INCLUDE_LIST:-openmrs.orders,openmrs.drug_order,openmrs.person,openmrs.person_name,openmrs.patient_identifier,openmrs.bed_type,openmrs.bed_patient_assignment_map}
      # Kafka retry topics (opt-in via @KafkaRetryable)
      - INTEGRATION_KAFKA_RETRY_ENABLED=${INTEGRATION_KAFKA_RETRY_ENABLED:-false}
      - INTEGRATION_KAFKA_RETRY_ATTEMPTS=${INTEGRATION_KAFKA_RETRY_ATTEMPTS:-5}
      - INTEGRATION_KAFKA_RETRY_INITIAL_DELAY=${INTEGRATION_KAFKA_RETRY_INITIAL_DELAY:-5s}
      - INTEGRATION_KAFKA_RETRY_MULTIPLIER=${INTEGRATION_KAFKA_RETRY_MULTIPLIER:-2.0}
      - INTEGRATION_KAFKA_RETRY_MAX_DELAY=${INTEGRATION_KAFKA_RETRY_MAX_DELAY:-10m}
      - INTEGRATION_KAFKA_RETRY_TOPIC_SUFFIX=${CIS_INTEGRATION_KAFKA_RETRY_TOPIC_SUFFIX:-cis-retry}
      - INTEGRATION_KAFKA_RETRY_DLT_SUFFIX=${CIS_INTEGRATION_KAFKA_RETRY_DLT_SUFFIX:-.cis.DLT}
    depends_on:
      nidan-integration-db:
        condition: service_healthy
      nidan-kafka:
        condition: service_healthy
      openmrs-db:
        condition: service_healthy
      openmrs-backend:
        condition: service_healthy
      # Orthanc dependency made optional - CIS can start without it if radiology is disabled
      orthanc:
        condition: service_started
    networks:
      - nidan-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:${CIS_PORT:-8081}/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  nidan-ois:
