      - INTEGRATION_DB_USER=${INTEGRATION_DB_USER:-nidan}
      - INTEGRATION_DB_PASSWORD=${INTEGRATION_DB_PASSWORD:-nidan}
      - MANAGEMENT_HEALTH_REDIS_ENABLED=${MANAGEMENT_HEALTH_REDIS_ENABLED:-false}
      # Kafka
